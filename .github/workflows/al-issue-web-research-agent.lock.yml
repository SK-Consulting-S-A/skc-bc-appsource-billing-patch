name: "Public Documentation Research"
on:
  workflow_call:
    inputs:
      network_allowed:
        default: ""
        description: "Additional allowed network domains or ecosystem identifiers to union with network.allowed (comma-separated, for example: \"rust\" or \"python,github.com\")."
        required: false
        type: string
      aw_context:
        default: ""
        description: "Agent caller context (used internally by Agentic Workflows)."
        required: false
        type: string
      issue_number:
        required: true
        type: string
      research_query:
        required: true
        type: string
      research_urls:
        required: true
        type: string
    outputs:
      comment_id:
        description: ID of the first added comment
        value: ${{ jobs.safe_outputs.outputs.comment_id }}
      comment_url:
        description: URL of the first added comment
        value: ${{ jobs.safe_outputs.outputs.comment_url }}
    secrets:
      COPILOT_GITHUB_TOKEN:
        required: false
      GH_AW_DEFAULT_OTLP_ENDPOINT:
        required: false
      GH_AW_DEFAULT_OTLP_HEADERS:
        required: false
      GH_AW_GITHUB_MCP_SERVER_TOKEN:
        required: false
      GH_AW_GITHUB_TOKEN:
        required: false

permissions: {}

concurrency:
  group: "gh-aw-al-issue-web-research-agent-${{ github.run_id }}"
  queue: max

run-name: "Public Documentation Research"

env:
  OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.GH_AW_DEFAULT_OTLP_ENDPOINT || vars.GH_AW_DEFAULT_OTLP_ENDPOINT }}
  OTEL_SERVICE_NAME: gh-aw.al-issue-web-research-agent
  OTEL_RESOURCE_ATTRIBUTES: 'gh-aw.workflow.name=Public%20Documentation%20Research,gh-aw.repository=${{ github.repository }},gh-aw.run.id=${{ github.run_id }},github.run_id=${{ github.run_id }},gh-aw.engine.id=pi'
  OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.GH_AW_DEFAULT_OTLP_HEADERS }}
  GH_AW_OTLP_ENDPOINTS: '[{"url":"${{ secrets.GH_AW_DEFAULT_OTLP_ENDPOINT || vars.GH_AW_DEFAULT_OTLP_ENDPOINT }}","headers":"${{ secrets.GH_AW_DEFAULT_OTLP_HEADERS }}"}]'
