name: "GPT-6 Sol Issue Triage Recovery"
on:
  workflow_dispatch:
    inputs:
      aw_context:
        default: ""
        description: "Agent caller context (Reserved for Agentic Workflows)."
        required: false
        type: string
      dispatch_receipt_id:
        description: Trusted dispatcher receipt correlation
        required: false
        type: string
      issue_number:
        description: Issue number to recover in the current repository
        required: true
        type: string
      origin_run_id:
        description: Failed or incomplete Luna run ID (idempotency key)
        required: true
        type: string

# Jobs receive only their explicitly declared permissions.
permissions: {}

concurrency:
  group: gh-aw-issue-triage-${{ github.event.inputs.issue_number }}
  queue: max

run-name: "Issue Triage Sol Recovery #${{ github.event.inputs.issue_number }} (Luna run ${{ github.event.inputs.origin_run_id }})${{ github.event.inputs.dispatch_receipt_id && format(' [{0}]', github.event.inputs.dispatch_receipt_id) || '' }}"

env:
  AL_ISSUE_TRIAGE_ACTION: opened
  AL_ISSUE_TRIAGE_COMMENT_ID: ""
  AL_ISSUE_TRIAGE_ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
  AL_TRIAGE_FALLBACK_MODE: sol
  OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.GH_AW_DEFAULT_OTLP_ENDPOINT || vars.GH_AW_DEFAULT_OTLP_ENDPOINT }}
  OTEL_SERVICE_NAME: gh-aw.al-issue-triage-sol
  OTEL_RESOURCE_ATTRIBUTES: 'gh-aw.workflow.name=GPT-6%20Sol%20Issue%20Triage%20Recovery,gh-aw.repository=${{ github.repository }},gh-aw.run.id=${{ github.run_id }},github.run_id=${{ github.run_id }},gh-aw.engine.id=pi'
  OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.GH_AW_DEFAULT_OTLP_HEADERS }}
  GH_AW_OTLP_ENDPOINTS: '[{"url":"${{ secrets.GH_AW_DEFAULT_OTLP_ENDPOINT || vars.GH_AW_DEFAULT_OTLP_ENDPOINT }}","headers":"${{ secrets.GH_AW_DEFAULT_OTLP_HEADERS }}"}]'
  GH_AW_OTLP_IF_MISSING: ignore

