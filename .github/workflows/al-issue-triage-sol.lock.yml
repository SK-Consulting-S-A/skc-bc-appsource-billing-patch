          GH_AW_EXPR_77C1A4D2: ${{ github.event.comment.id || fromJSON(steps.generate_aw_info.outputs.aw_context || '{}').comment_id }}
          GH_AW_EXPR_7C248226: ${{ github.event.issue.number || (fromJSON(steps.generate_aw_info.outputs.aw_context || '{}').item_type == 'issue' && fromJSON(steps.generate_aw_info.outputs.aw_context || '{}').item_number) }}
          GH_AW_EXPR_C19C384F: ${{ github.event.discussion.number || (fromJSON(steps.generate_aw_info.outputs.aw_context || '{}').item_type == 'discussion' && fromJSON(steps.generate_aw_info.outputs.aw_context || '{}').item_number) }}
          GH_AW_GITHUB_ACTOR: ${{ github.actor }}
          GH_AW_GITHUB_EVENT_INPUTS_ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
          GH_AW_GITHUB_EVENT_INPUTS_ORIGIN_RUN_ID: ${{ github.event.inputs.origin_run_id }}
          GH_AW_GITHUB_REPOSITORY: ${{ github.repository }}
          GH_AW_GITHUB_RUN_ID: ${{ github.run_id }}
          GH_AW_GITHUB_WORKSPACE: ${{ github.workspace }}
          GH_AW_PROMPT_CONTENT_0000: "<system>\n"
          GH_AW_PROMPT_CONTENT_0001: "<safe-output-tools>\nTools: update_issue, add_labels(max:6), remove_labels, set_issue_type, set_issue_field(max:2), report_missing_tool, report_missing_data, post_triage_comment\n"
          GH_AW_PROMPT_CONTENT_0002: "</safe-output-tools>\n"
          GH_AW_PROMPT_CONTENT_0003: "<github-context>\nThe following GitHub context information is available for this workflow:\n{{#if github.actor}}\n- **actor**: __GH_AW_GITHUB_ACTOR__\n{{/if}}\n{{#if github.repository}}\n- **repository**: __GH_AW_GITHUB_REPOSITORY__\n{{/if}}\n{{#if github.workspace}}\n- **workspace**: __GH_AW_GITHUB_WORKSPACE__\n{{/if}}\n{{#if github.event.issue.number || (github.aw.context.item_type == 'issue' && github.aw.context.item_number)}}\n- **issue-number**: #__GH_AW_EXPR_7C248226__\n{{/if}}\n{{#if github.event.discussion.number || (github.aw.context.item_type == 'discussion' && github.aw.context.item_number)}}\n- **discussion-number**: #__GH_AW_EXPR_C19C384F__\n{{/if}}\n{{#if github.event.pull_request.number || (github.aw.context.item_type == 'pull_request' && github.aw.context.item_number)}}\n- **pull-request-number**: #__GH_AW_EXPR_76DF9333__\n{{/if}}\n{{#if github.event.comment.id || github.aw.context.comment_id}}\n- **comment-id**: __GH_AW_EXPR_77C1A4D2__\n{{/if}}\n{{#if github.run_id}}\n- **workflow-run-id**: __GH_AW_GITHUB_RUN_ID__\n{{/if}}\n</github-context>\n\n"
          GH_AW_PROMPT_CONTENT_0004: "</system>\n"
          GH_AW_PROMPT_CONTENT_0005: "{{#runtime-import .github/workflows/shared/al-issue-triage-prompt.md}}\n"
          GH_AW_PROMPT_CONTENT_0006: "{{#runtime-import .github/workflows/al-issue-triage-sol.md}}\n"
        with:
          script: |
            const { setupGlobals } = require(process.env.GH_AW_ACTIONS_DIR + '/setup_globals.cjs');
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(process.env.GH_AW_ACTIONS_DIR + '/create_prompt.cjs');
            await main(core);
      - name: Interpolate variables and render templates
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_PROMPT: ${{ runner.temp }}/gh-aw/aw-prompts/prompt.txt
          GH_AW_ENGINE_ID: "pi"
          GH_AW_SUB_AGENT_DIR: ".pi/agents"
          GH_AW_SUB_AGENT_EXT: ".md"
          GH_AW_SKILL_DIR: ".pi/skills"
          GH_AW_SKILL_EXT: "/SKILL.md"
          GH_AW_GITHUB_EVENT_INPUTS_ORIGIN_RUN_ID: ${{ github.event.inputs.origin_run_id }}
          GH_AW_EXPR_258C5978: ${{ github.event.inputs.comment_id || '' }}
          GH_AW_EXPR_4729FAC9: ${{ github.event.inputs.issue_action || 'opened' }}
          GH_AW_GITHUB_EVENT_INPUTS_ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'interpolate_prompt.cjs'));
            await main();
      - name: Substitute placeholders
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_PROMPT: ${{ runner.temp }}/gh-aw/aw-prompts/prompt.txt
          GH_AW_EXPR_258C5978: ${{ github.event.inputs.comment_id || '' }}
          GH_AW_EXPR_4729FAC9: ${{ github.event.inputs.issue_action || 'opened' }}
          GH_AW_EXPR_76DF9333: ${{ github.event.pull_request.number || (fromJSON(steps.generate_aw_info.outputs.aw_context || '{}').item_type == 'pull_request' && fromJSON(steps.generate_aw_info.outputs.aw_context || '{}').item_number) }}
          GH_AW_EXPR_77C1A4D2: ${{ github.event.comment.id || fromJSON(steps.generate_aw_info.outputs.aw_context || '{}').comment_id }}
          GH_AW_EXPR_7C248226: ${{ github.event.issue.number || (fromJSON(steps.generate_aw_info.outputs.aw_context || '{}').item_type == 'issue' && fromJSON(steps.generate_aw_info.outputs.aw_context || '{}').item_number) }}
          GH_AW_EXPR_C19C384F: ${{ github.event.discussion.number || (fromJSON(steps.generate_aw_info.outputs.aw_context || '{}').item_type == 'discussion' && fromJSON(steps.generate_aw_info.outputs.aw_context || '{}').item_number) }}
          GH_AW_GITHUB_ACTOR: ${{ github.actor }}
          GH_AW_GITHUB_EVENT_INPUTS_ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
          GH_AW_GITHUB_EVENT_INPUTS_ORIGIN_RUN_ID: ${{ github.event.inputs.origin_run_id }}
          GH_AW_GITHUB_REPOSITORY: ${{ github.repository }}
          GH_AW_GITHUB_RUN_ID: ${{ github.run_id }}
          GH_AW_GITHUB_WORKSPACE: ${{ github.workspace }}
          GH_AW_MCP_CLI_SERVERS_LIST: '- `safeoutputs` — run `safeoutputs --help` to see available tools'
        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);

            const substitutePlaceholders = require(path.join(actionsDir, 'substitute_placeholders.cjs'));

            // Call the substitution function
            return await substitutePlaceholders({
              file: process.env.GH_AW_PROMPT,
              substitutions: {
                GH_AW_EXPR_258C5978: process.env.GH_AW_EXPR_258C5978,
                GH_AW_EXPR_4729FAC9: process.env.GH_AW_EXPR_4729FAC9,
                GH_AW_EXPR_76DF9333: process.env.GH_AW_EXPR_76DF9333,
                GH_AW_EXPR_77C1A4D2: process.env.GH_AW_EXPR_77C1A4D2,
                GH_AW_EXPR_7C248226: process.env.GH_AW_EXPR_7C248226,
                GH_AW_EXPR_C19C384F: process.env.GH_AW_EXPR_C19C384F,
                GH_AW_GITHUB_ACTOR: process.env.GH_AW_GITHUB_ACTOR,
                GH_AW_GITHUB_EVENT_INPUTS_ISSUE_NUMBER: process.env.GH_AW_GITHUB_EVENT_INPUTS_ISSUE_NUMBER,
                GH_AW_GITHUB_EVENT_INPUTS_ORIGIN_RUN_ID: process.env.GH_AW_GITHUB_EVENT_INPUTS_ORIGIN_RUN_ID,
                GH_AW_GITHUB_REPOSITORY: process.env.GH_AW_GITHUB_REPOSITORY,
                GH_AW_GITHUB_RUN_ID: process.env.GH_AW_GITHUB_RUN_ID,
                GH_AW_GITHUB_WORKSPACE: process.env.GH_AW_GITHUB_WORKSPACE,
                GH_AW_MCP_CLI_SERVERS_LIST: process.env.GH_AW_MCP_CLI_SERVERS_LIST
              }
            });
      - name: Validate prompt placeholders
        env:
          GH_AW_PROMPT: ${{ runner.temp }}/gh-aw/aw-prompts/prompt.txt
        run: |
          bash "${RUNNER_TEMP}/gh-aw/actions/validate_prompt_placeholders.sh"
      - name: Print prompt
        env:
          GH_AW_PROMPT: ${{ runner.temp }}/gh-aw/aw-prompts/prompt.txt
        run: |
          bash "${RUNNER_TEMP}/gh-aw/actions/print_prompt_summary.sh"
      - name: Inventory installed skills
        if: success() || failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_SKILL_DIR: ".pi/skills"
        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'skill_inventory.cjs'));
            await main();
      - name: Upload info artifact
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: info
          path: /tmp/gh-aw/aw_info.json
          if-no-files-found: ignore
          retention-days: ${{ vars.GH_AW_DEFAULT_ARTIFACT_RETENTION_DAYS || '0' }}
      - name: Stage prompt files for artifact upload
        run: |
          mkdir -p /tmp/gh-aw/aw-prompts
          cp -a "${RUNNER_TEMP}/gh-aw/aw-prompts/." /tmp/gh-aw/aw-prompts/
      - name: Upload activation artifact
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: activation
          include-hidden-files: true
          path: |
            /tmp/gh-aw/aw_info.json
            /tmp/gh-aw/models.json
            /tmp/gh-aw/aw-prompts/prompt.txt
            /tmp/gh-aw/aw-prompts/system.txt
            /tmp/gh-aw/aw-prompts/user.txt
            /tmp/gh-aw/aw-prompts/prompt-template.txt
            /tmp/gh-aw/aw-prompts/prompt-import-tree.json
            /tmp/gh-aw/github_rate_limits.jsonl
            /tmp/gh-aw/base
            /tmp/gh-aw/.pi/agents
            /tmp/gh-aw/.pi/skills
            /tmp/gh-aw/skill_inventory.json
          if-no-files-found: ignore
          retention-days: ${{ vars.GH_AW_DEFAULT_ARTIFACT_RETENTION_DAYS || '1' }}

  agent:
    name: agent
    needs:
      - activation
      - triage_ownership
    if: >
      (needs.activation.outputs.daily_ai_credits_exceeded != 'true') && (needs.triage_ownership.outputs.decision == 'admitted')
    runs-on: ubuntu-latest
    # Permissions for the agent job (workflow permissions default to none).
    permissions:
      contents: read
      issues: read
      pull-requests: read
    timeout-minutes: 60
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_AW_ASSETS_ALLOWED_EXTS: ""
      GH_AW_ASSETS_BRANCH: ""
      GH_AW_ASSETS_MAX_SIZE_KB: 0
      GH_AW_ENGINE_VERSION: "1.5.0"
      GH_AW_MCP_LOG_DIR: /tmp/gh-aw/mcp-logs/safeoutputs
      GH_AW_PR_HEAD_BASE_BRANCH: ""
      GH_AW_PR_HEAD_BASE_PR_NUMBER: ""
      GH_AW_PR_HEAD_BASE_REF: ""
      GH_AW_PR_HEAD_BASE_REPO: ""
      GH_AW_PR_HEAD_BASE_SHA: ""
      GH_AW_PR_HEAD_REPO: ""
      GH_AW_RUNTIME_FEATURES: ${{ vars.GH_AW_RUNTIME_FEATURES }}
      GH_AW_TARGET_REPO_SLUG: ""
      GH_AW_WORKFLOW_ID_SANITIZED: alissuetriagesol
    outputs:
      triage_preflight_decision: ${{ steps.eligibility_recheck.outputs.decision }}
      agentic_engine_timeout: ${{ steps.detect-agent-errors.outputs.agentic_engine_timeout || 'false' }}
      ai_credits_rate_limit_error: ${{ steps.parse-mcp-gateway.outputs.ai_credits_rate_limit_error || 'false' }}
      aic: ${{ steps.parse-token-usage.outputs.aic }}
      ambient_context: ${{ steps.parse-token-usage.outputs.ambient_context }}
      checkout_pr_invalidated: ${{ steps.checkout-pr.outputs.checkout_pr_invalidated || 'false' }}
      checkout_pr_success: ${{ steps.checkout-pr.outputs.checkout_pr_success || 'true' }}
      has_patch: ${{ steps.collect_output.outputs.has_patch }}
      http_400_response_error: ${{ steps.detect-agent-errors.outputs.http_400_response_error || 'false' }}
      inference_access_error: ${{ steps.detect-agent-errors.outputs.inference_access_error || 'false' }}
      invocation_cap_exceeded: ${{ steps.detect-agent-errors.outputs.invocation_cap_exceeded || 'false' }}
      max_cache_misses_exceeded: ${{ steps.detect-agent-errors.outputs.max_cache_misses_exceeded || 'false' }}
      mcp_policy_error: ${{ steps.detect-agent-errors.outputs.mcp_policy_error || 'false' }}
      missing_model_pricing_error: ${{ steps.detect-agent-errors.outputs.missing_model_pricing_error || 'false' }}
      missing_model_pricing_model_name: ${{ steps.detect-agent-errors.outputs.missing_model_pricing_model_name || '' }}
      model: ${{ needs.activation.outputs.model }}
      model_endpoint_mismatch_error: ${{ steps.detect-agent-errors.outputs.model_endpoint_mismatch_error || 'false' }}
      model_not_supported_error: ${{ steps.detect-agent-errors.outputs.model_not_supported_error || 'false' }}
      output: ${{ steps.collect_output.outputs.output }}
      output_types: ${{ steps.collect_output.outputs.output_types }}
      setup-parent-span-id: ${{ steps.setup.outputs.parent-span-id || steps.setup.outputs.span-id }}
      setup-span-id: ${{ steps.setup.outputs.span-id }}
      setup-trace-id: ${{ steps.setup.outputs.trace-id }}
      shell_expansion_guard_rejected: ${{ steps.detect-agent-errors.outputs.shell_expansion_guard_rejected || 'false' }}
      unknown_model_ai_credits: ${{ steps.parse-mcp-gateway.outputs.unknown_model_ai_credits || 'false' }}
    steps:
      - name: Setup Scripts
        id: setup
        uses: github/gh-aw/actions/setup@0627fdbe4beb5f3b71aa569f8d97150b87f2111a
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
          job-name: ${{ github.job }}
          trace-id: ${{ needs.activation.outputs.setup-trace-id }}
          parent-span-id: ${{ needs.activation.outputs.setup-parent-span-id || needs.activation.outputs.setup-span-id }}
        env:
          GH_AW_SETUP_WORKFLOW_NAME: "GPT-6 Sol Issue Triage Recovery"
          GH_AW_CURRENT_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/al-issue-triage-sol.lock.yml@${{ github.ref }}
          GH_AW_INFO_VERSION: "1.5.0"
          GH_AW_INFO_AWF_VERSION: "v0.29.0"
          GH_AW_INFO_ENGINE_ID: "pi"
          GH_AW_SETUP_AW_CONTEXT: ${{ inputs.aw_context }}
      - name: Set runtime paths
        id: set-runtime-paths
        env:
          GH_AW_RUNNER_TOOL_CACHE: ${{ runner.tool_cache }}
        run: | # zizmor: ignore[github-env] - runner.tool_cache is set by GitHub Actions, not user input.
          if [ -z "${RUNNER_TOOL_CACHE:-}" ]; then
            echo "RUNNER_TOOL_CACHE=${GH_AW_RUNNER_TOOL_CACHE}" >> "$GITHUB_ENV"
          fi
          {
            echo "GH_AW_SAFE_OUTPUTS=${RUNNER_TEMP}/gh-aw/safeoutputs/outputs.jsonl"
            echo "GH_AW_SAFE_OUTPUTS_CONFIG_PATH=${RUNNER_TEMP}/gh-aw/safeoutputs/config.json"
            echo "GH_AW_SAFE_OUTPUTS_TOOLS_PATH=${RUNNER_TEMP}/gh-aw/safeoutputs/tools.json"
          } >> "$GITHUB_OUTPUT"
      - name: Mask OTLP telemetry headers
        run: bash "${RUNNER_TEMP}/gh-aw/actions/mask_otlp_headers.sh"
      - name: Check OTLP telemetry configuration
        run: bash "${RUNNER_TEMP}/gh-aw/actions/check_otlp_default_credentials.sh"
      - name: Checkout repository (gh-aw default)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize agent execution evidence
        run: |
          mkdir -p "/tmp/gh-aw"
          evidence_tmp="/tmp/gh-aw/agent_execution.json.tmp"
          printf '{"version":1,"component":"agent","run_id":%s,"run_attempt":%s,"state":"not_started"}\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$evidence_tmp"
          mv "$evidence_tmp" "/tmp/gh-aw/agent_execution.json"
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Create gh-aw temp directory
        run: bash "${RUNNER_TEMP}/gh-aw/actions/create_gh_aw_tmp_dir.sh"
      - name: Configure gh CLI for GitHub Enterprise
        run: bash "${RUNNER_TEMP}/gh-aw/actions/configure_gh_for_ghe.sh"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Download activation artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: activation
          path: /tmp/gh-aw
      - env:
          AL_OWNERSHIP_ISSUE: ${{ github.event.inputs.issue_number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        id: eligibility_recheck
        name: Check whether implementation already owns the issue
        run: "set -uo pipefail\nmkdir -p /tmp/gh-aw/agent\nout=/tmp/gh-aw/agent/issue-ownership.json\nresult=''\nif [[ \"${AL_OWNERSHIP_ISSUE}\" =~ ^[1-9][0-9]*$ ]]; then\n  result=\"$(gh api graphql \\\n    -f query='query($owner: String!, $repo: String!, $number: Int!) { repository(owner: $owner, name: $repo) { issue(number: $number) { number state labels(first: 100) { nodes { name } pageInfo { hasNextPage } } assignees(first: 100) { nodes { login } pageInfo { hasNextPage } } closedByPullRequestsReferences(first: 1, includeClosedPrs: false) { totalCount } } } }' \\\n    -f owner=\"${GITHUB_REPOSITORY%%/*}\" -f repo=\"${GITHUB_REPOSITORY#*/}\" -F number=\"${AL_OWNERSHIP_ISSUE}\" 2>/dev/null)\" || result=''\nfi\nOWNERSHIP_RESULT=\"${result}\" node -e '\n  let reason = \"issue eligibility or ownership could not be verified\";\n  try {\n    const response = JSON.parse(process.env.OWNERSHIP_RESULT);\n    if (Object.hasOwn(response, \"errors\") && (!Array.isArray(response.errors) || response.errors.length)) throw new Error(\"GraphQL returned errors\");\n    const issue = response.data.repository.issue;\n    const count = issue.closedByPullRequestsReferences.totalCount;\n    const issueNumber = Number(process.env.AL_OWNERSHIP_ISSUE);\n    if (!Number.isSafeInteger(issueNumber) || issueNumber < 1 || issue.number !== issueNumber ||\n      ![\"OPEN\", \"CLOSED\"].includes(issue.state) ||\n      !Array.isArray(issue.labels.nodes) || issue.labels.pageInfo?.hasNextPage !== false ||\n      issue.labels.nodes.some(node => typeof node?.name !== \"string\" || !node.name.trim()) ||\n      !Array.isArray(issue.assignees.nodes) || issue.assignees.pageInfo?.hasNextPage !== false ||\n      issue.assignees.nodes.some(node => typeof node?.login !== \"string\" ||\n      !/^[a-z0-9-]+(?:\\[bot\\])?$/i.test(node.login))) throw new Error(\"invalid assignees\");\n    const terminalLabels = [\"ready-to-implement\", \"implemented\", \"research-canary\",\n      \"agentic-workflows\", \"ci-failure-analysis\", \"needs-human-approval\",\n      \"awaiting-human-approval\", \"triage-disputed\"];\n    if (issue.state !== \"OPEN\" || issue.labels.nodes.some(node => terminalLabels.includes(node.name.toLowerCase()))) reason = \"the issue is no longer eligible for triage\";\n    else if (issue.assignees.nodes.some(node => /^(?:copilot|copilot-swe-agent)(?:\\[bot\\])?$/i.test(node.login))) reason = \"assigned to the Copilot coding agent\";\n    else if (Number.isSafeInteger(count) && count > 0) reason = \"an open pull request is linked to this issue\";\n    else if (count === 0) reason = \"\";\n  } catch {}\n  const fs = require(\"node:fs\");\n  fs.writeFileSync(process.argv[1], JSON.stringify({ skip: reason !== \"\", reason }) + \"\\n\");\n  fs.appendFileSync(process.env.GITHUB_OUTPUT, `decision=${reason ? \"blocked\" : \"admitted\"}\\n`);\n  console.log(`[issue-ownership] skip=${reason !== \"\"} reason=${reason || \"none\"}`);\n' \"${out}\"\n"
      - if: steps.eligibility_recheck.outputs.decision == 'admitted'
        name: Pre-agent eligibility admitted
        run: echo "Live triage eligibility verified."
      - if: steps.eligibility_recheck.outputs.decision == 'blocked'
        name: Pre-agent eligibility blocked
        run: echo "Live triage eligibility could not be verified; inference is blocked."
      - env:
          AL_ISSUE_IMAGES_ISSUE: ${{ github.event.inputs.issue_number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        name: Download issue images for the agent
        run: "set -euo pipefail\nmkdir -p \"${RUNNER_TEMP}/issue-images-tool\"\ncat > \"${RUNNER_TEMP}/issue-images-tool/issue-images.cjs\" <<'JAVASCRIPT'\n\"use strict\";\n// Private attachment links only work as short-lived signed URLs from body_html.\nconst fs = require(\"node:fs\");\nconst path = require(\"node:path\");\n\nconst OUT_DIR = \"/tmp/gh-aw/agent/issue-images\";\nconst MAX_IMAGES = 10;\nconst MAX_BYTES = 5 * 1024 * 1024;\nconst MAX_COMMENT_PAGES = 5;\nconst MAX_REDIRECTS = 3;\nconst TIMEOUT_MS = 30000;\nconst EXTENSIONS = { \"image/png\": \"png\", \"image/jpeg\": \"jpg\", \"image/gif\": \"gif\", \"image/webp\": \"webp\" };\nconst IMAGE_HOSTS = new Set([\"private-user-images.githubusercontent.com\", \"user-images.githubusercontent.com\"]);\nconst ENTITIES = { amp: \"&\", quot: \"\\\"\", \"#39\": \"'\", lt: \"<\", gt: \">\" };\n\nconst decodeEntities = (value) => value.replace(/&(amp|quot|#39|lt|gt);/g, (_, name) => ENTITIES[name]);\n\nfunction parseHttps(raw) {\n  let url;\n  try { url = new URL(raw); } catch { return null; }\n  if (url.protocol !== \"https:\" || url.username || url.password || url.port) return null;\n  return url;\n}\n\nfunction isAllowedImageUrl(raw) {\n  const url = parseHttps(raw);\n  if (!url) return false;\n  if (IMAGE_HOSTS.has(url.hostname)) return true;\n  return url.hostname === \"github.com\" && /^\\/user-attachments\\/assets\\/[0-9a-f-]+$/i.test(url.pathname);\n}\n\nfunction isAllowedRedirect(raw) {\n  const url = parseHttps(raw);\n  if (!url) return false;\n  return isAllowedImageUrl(raw) || /^github-production-user-asset-[a-z0-9]+\\.s3\\.amazonaws\\.com$/.test(url.hostname);\n}\n\nfunction extractImages(html) {\n  const images = [];\n  for (const tag of String(html || \"\").match(/<img\\b[^>]*>/gi) || []) {\n    const src = /\\ssrc=\"([^\"]+)\"/i.exec(tag);\n    if (!src) continue;\n    const url = decodeEntities(src[1]);\n    if (!isAllowedImageUrl(url)) continue;\n    const alt = /\\salt=\"([^\"]*)\"/i.exec(tag);\n    images.push({ url, alt: alt ? decodeEntities(alt[1]).slice(0, 200) : \"\" });\n  }\n  return images;\n}\n\nfunction sniff(buffer) {\n  const ascii = (start, end) => buffer.subarray(start, end).toString(\"latin1\");\n  if (buffer.length >= 8 && buffer.subarray(0, 8).equals(Buffer.from([0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a]))) return \"image/png\";\n  if (buffer.length >= 3 && buffer[0] === 0xff && buffer[1] === 0xd8 && buffer[2] === 0xff) return \"image/jpeg\";\n  if (buffer.length >= 6 && /^GIF8[79]a$/.test(ascii(0, 6))) return \"image/gif\";\n  if (buffer.length >= 12 && ascii(0, 4) === \"RIFF\" && ascii(8, 12) === \"WEBP\") return \"image/webp\";\n  return null;\n}\n\n// Categories only: messages could echo signed URLs.\nfunction category(error) {\n  if (error?.name === \"TimeoutError\" || error?.name === \"AbortError\") return \"timeout\";\n  return /^[a-z0-9_]+$/.test(error?.message || \"\") ? error.message : \"network_error\";\n}\n\nasync function api(fetchImpl, env, route) {\n  const base = (env.GITHUB_API_URL || \"https://api.github.com\").replace(/\\/+$/, \"\");\n  const response = await fetchImpl(`${base}${route}`, {\n    headers: {\n      Accept: \"application/vnd.github.full+json\",\n      Authorization: `Bearer ${env.GH_TOKEN}`,\n      \"User-Agent\": \"skc-issue-triage-images\",\n      \"X-GitHub-Api-Version\": \"2022-11-28\",\n    },\n    signal: AbortSignal.timeout(TIMEOUT_MS),\n  });\n  if (!response.ok) throw new Error(`api_http_${response.status}`);\n  return response.json();\n}\n\nasync function download(fetchImpl, url) {\n  let current = url;\n  for (let hop = 0; hop <= MAX_REDIRECTS; hop++) {\n    const response = await fetchImpl(current, { redirect: \"manual\", signal: AbortSignal.timeout(TIMEOUT_MS) });\n    if (response.status >= 300 && response.status < 400) {\n      const location = response.headers.get(\"location\");\n      if (!location) throw new Error(\"redirect_without_location\");\n      current = new URL(location, current).toString();\n      if (!isAllowedRedirect(current)) throw new Error(\"redirect_host_refused\");\n      continue;\n    }\n    if (!response.ok) throw new Error(`http_${response.status}`);\n    if (Number(response.headers.get(\"content-length\") || 0) > MAX_BYTES) throw new Error(\"too_large\");\n    const chunks = [];\n    let total = 0;\n    for await (const chunk of response.body) {\n      total += chunk.length;\n      if (total > MAX_BYTES) throw new Error(\"too_large\");\n      chunks.push(Buffer.from(chunk));\n    }\n    return Buffer.concat(chunks);\n  }\n  throw new Error(\"too_many_redirects\");\n}\n\nasync function collectSources(fetchImpl, env, repo, issue) {\n  const data = await api(fetchImpl, env, `/repos/${repo}/issues/${issue}`);\n  const sources = [{ source: \"issue_body\", comment_id: null, author: data.user?.login ?? null, created_at: data.created_at ?? null, html: data.body_html }];\n  for (let page = 1; page <= MAX_COMMENT_PAGES; page++) {\n    const comments = await api(fetchImpl, env, `/repos/${repo}/issues/${issue}/comments?per_page=100&page=${page}`);\n    if (!Array.isArray(comments)) break;\n    for (const comment of comments) {\n      if (comment.user?.type === \"Bot\") continue;\n      sources.push({ source: \"comment\", comment_id: comment.id ?? null, author: comment.user?.login ?? null, created_at: comment.created_at ?? null, html: comment.body_html });\n    }\n    if (comments.length < 100) break;\n  }\n  return sources;\n}\n\nasync function main({ env = process.env, fetchImpl = fetch, outDir = OUT_DIR } = {}) {\n  fs.rmSync(outDir, { recursive: true, force: true });\n  fs.mkdirSync(outDir, { recursive: true });\n  const manifest = { issue: null, images: [], errors: [] };\n  const repo = env.GITHUB_REPOSITORY || \"\";\n  const issue = env.AL_ISSUE_IMAGES_ISSUE || \"\";\n  if (!/^[\\w.-]+\\/[\\w.-]+$/.test(repo) || !/^[1-9]\\d*$/.test(issue)) {\n    manifest.errors.push(\"invalid_inputs\");\n  } else {\n    manifest.issue = Number(issue);\n    let sources = [];\n    try { sources = await collectSources(fetchImpl, env, repo, issue); } catch (error) { manifest.errors.push(category(error)); }\n    const seen = new Set();\n    for (const source of sources) {\n      for (const image of extractImages(source.html)) {\n        const parsed = new URL(image.url);\n        const key = `${parsed.hostname}${parsed.pathname}`;\n        if (seen.has(key)) continue;\n        seen.add(key);\n        const entry = { index: seen.size, source: source.source, comment_id: source.comment_id, author: source.author, created_at: source.created_at, alt: image.alt };\n        if (entry.index > MAX_IMAGES) {\n          entry.status = \"skipped_limit\";\n        } else {\n          try {\n            const buffer = await download(fetchImpl, image.url);\n            const type = sniff(buffer);\n            if (!type) throw new Error(\"not_an_image\");\n            entry.file = path.join(outDir, `image-${entry.index}.${EXTENSIONS[type]}`);\n            fs.writeFileSync(entry.file, buffer);\n            Object.assign(entry, { status: \"ok\", content_type: type, bytes: buffer.length });\n          } catch (error) {\n            Object.assign(entry, { status: \"failed\", reason: category(error) });\n          }\n        }\n        manifest.images.push(entry);\n      }\n    }\n  }\n  fs.writeFileSync(path.join(outDir, \"manifest.json\"), `${JSON.stringify(manifest, null, 2)}\\n`);\n  const count = (status) => manifest.images.filter((entry) => entry.status === status).length;\n  console.log(`[issue-images] found=${manifest.images.length} ok=${count(\"ok\")} failed=${count(\"failed\")} skipped=${count(\"skipped_limit\")} errors=${manifest.errors.join(\",\") || \"none\"}`);\n  return manifest;\n}\n\nmodule.exports = { MAX_BYTES, MAX_IMAGES, extractImages, isAllowedImageUrl, isAllowedRedirect, main, sniff };\n\nif (require.main === module) {\n  main().catch((error) => console.log(`[issue-images] aborted: ${category(error)}`));\n}\nJAVASCRIPT\nnode \"${RUNNER_TEMP}/issue-images-tool/issue-images.cjs\""

      - name: Configure Git credentials
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "${RUNNER_TEMP}/gh-aw/actions/configure_git_credentials.sh"
      - name: Checkout PR branch
        id: checkout-pr
        if: |
          github.event.pull_request || github.event.issue.pull_request || github.event_name == 'workflow_dispatch'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_TOKEN: ${{ secrets.GH_AW_GITHUB_MCP_SERVER_TOKEN }}
        with:
          github-token: ${{ secrets.GH_AW_GITHUB_MCP_SERVER_TOKEN }}
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'checkout_pr_branch.cjs'));
            await main();
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install AWF binary
        run: bash "${RUNNER_TEMP}/gh-aw/actions/install_awf_binary.sh" v0.29.0 --rootless
      - name: Install Pi CLI
        run: npm install --ignore-scripts -g @earendil-works/pi-coding-agent@1.5.0
      - name: Record Pi package location
        run: |
          GH_AW_PI_PACKAGE_ROOT="$(npm root -g)/@earendil-works/pi-coding-agent"
          printf 'GH_AW_PI_PACKAGE_ROOT=%s\n' "$GH_AW_PI_PACKAGE_ROOT" >> "$GITHUB_ENV"
      - name: Determine automatic lockdown mode for GitHub MCP Server
        id: determine-automatic-lockdown
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_GITHUB_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN }}
          GH_AW_GITHUB_MCP_SERVER_TOKEN: ${{ secrets.GH_AW_GITHUB_MCP_SERVER_TOKEN }}
        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const determineAutomaticLockdown = require(path.join(actionsDir, 'determine_automatic_lockdown.cjs'));
            await determineAutomaticLockdown(github, context, core);
