name: "New AL Feature Dispatcher"

# Lightweight dispatcher that only triggers al-new-feature when the
# "ready-to-implement" label is added.  This prevents the expensive
# agentic workflow from spinning up for every label change.
#
# This workflow is deployed to EVERY org BC repo by the bootstrap job
# in al-org-scan.yml.  When running in a target repo it dispatches
# the agent in skc-bc-internal-agents, passing target_repo so the agent operates
# on the correct codebase.
#
# PREREQUISITE: The org-level secret GH_AW_GITHUB_MCP_SERVER_TOKEN
# must be available to all BC repos (set as an org secret with
# "All repositories" or "Selected repositories" visibility).

on:
  issues:
    types: [labeled]

permissions:
  actions: write
  issues: write
  pull-requests: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    if: github.event.label.name == 'ready-to-implement' && !contains(github.event.issue.labels.*.name, 'research-canary')
    steps:
      - name: Dispatch al-new-feature agent
        id: dispatch
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8 (Node 24)
        with:
          github-token: ${{ secrets.GH_AW_GITHUB_MCP_SERVER_TOKEN || github.token }}
          script: |
            const AGENT_OWNER = 'SK-Consulting-S-A';
            const AGENT_REPO  = 'skc-bc-internal-agents';
            const thisRepo = `${context.repo.owner}/${context.repo.repo}`;
            const isLocal  = (context.repo.repo === AGENT_REPO);
            const issueNumber = context.payload.issue.number;
            const copilotLogin = /^(?:copilot|copilot-swe-agent)(?:\[bot\])?$/i;
            const validLogin = /^[a-z0-9-]+(?:\[bot\])?$/i;
            const linkedPullsQuery = 'query($owner: String!, $repo: String!, $number: Int!) { repository(owner: $owner, name: $repo) { issue(number: $number) { closedByPullRequestsReferences(first: 1, includeClosedPrs: false) { totalCount } } } }';

            async function ownershipReason() {
              try {
                if (!Number.isSafeInteger(issueNumber) || issueNumber <= 0) throw new Error('invalid issue number');
                const { data: issue } = await github.rest.issues.get({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber,
                });
                if (!issue || issue.number !== issueNumber || typeof issue.state !== 'string' ||
                    !Array.isArray(issue.assignees) ||
                    issue.assignees.some(a => !a || typeof a.login !== 'string' || !validLogin.test(a.login)) ||
                    !Array.isArray(issue.labels) ||
                    issue.labels.some(label => typeof (typeof label === 'string' ? label : label?.name) !== 'string' ||
                      !(typeof label === 'string' ? label : label.name))) {
                  throw new Error('invalid issue response');
                }
                const labels = issue.labels.map(label => (typeof label === 'string' ? label : label.name).toLowerCase());
                if (issue.state !== 'open' || issue.pull_request || !labels.includes('ready-to-implement')) return 'no longer an open ready issue';
                if (labels.includes('research-canary')) return 'a research canary';
                if (issue.assignees.some(a => copilotLogin.test(a.login))) return 'assigned to Copilot';

                const linked = await github.graphql(linkedPullsQuery, {
                  owner: context.repo.owner, repo: context.repo.repo, number: issueNumber,
                });
                if (linked != null && Object.hasOwn(linked, 'errors') && (!Array.isArray(linked.errors) || linked.errors.length)) {
                  throw new Error('GraphQL returned errors');
                }
                const count = linked?.repository?.issue?.closedByPullRequestsReferences?.totalCount;
                if (!Number.isSafeInteger(count) || count < 0) throw new Error('invalid linked pull request count');
                return count > 0 ? 'an open closing PR is linked' : '';
              } catch (error) {
                core.warning(`Cannot verify implementation ownership for ${thisRepo}#${issueNumber}: ${error.message}.`);
                return 'ownership could not be verified';
              }
            }

            let owned = await ownershipReason();
            if (owned) {
              core.info(`Issue #${issueNumber} is ${owned} — skipping dispatch.`);
              return;
            }

            // Check every page for the standard feature/<issueNumber>-* branch.
            async function featurePrReason() {
              try {
                const openPulls = await github.paginate(github.rest.pulls.list, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'open',
                  per_page: 100,
                });
                if (!Array.isArray(openPulls) ||
                    openPulls.some(pr => typeof pr?.head?.ref !== 'string' || !pr.head.ref)) {
                  throw new Error('invalid open pull request response');
                }
                return openPulls.some(pr => pr.head.ref.startsWith(`feature/${issueNumber}-`))
                  ? 'an implementation PR is open' : '';
              } catch (err) {
                core.warning(
                  `Could not check for an existing implementation PR on ${thisRepo} ` +
                  `(status=${err.status ?? 'unknown'}): ${err.message}.`
                );
                return 'implementation PRs could not be verified';
              }
            }
            let featurePr = await featurePrReason();
            if (featurePr) {
              core.info(`Issue #${issueNumber}: ${featurePr} — skipping dispatch.`);
              return;
            }

            // Cross-repo dispatch requires a PAT with Actions write on the agent repo.
            // Verify ownership first so an already-owned issue never receives a failure comment.
            const patAvailable = Boolean('${{ secrets.GH_AW_GITHUB_MCP_SERVER_TOKEN }}');
            if (!isLocal && !patAvailable) {
              featurePr = await featurePrReason();
              if (featurePr) {
                core.info(`Issue #${issueNumber}: ${featurePr} — skipping failure comment.`);
                return;
              }
              owned = await ownershipReason();
              if (owned) {
                core.info(`Issue #${issueNumber} is ${owned} — skipping dispatch.`);
                return;
              }
              const reason =
                `GH_AW_GITHUB_MCP_SERVER_TOKEN is not available on ${thisRepo}. ` +
                `Grant the org secret to this repository: GitHub → ${context.repo.owner} → ` +
                `Settings → Secrets and variables → Actions → GH_AW_GITHUB_MCP_SERVER_TOKEN → ` +
                `Repository access → add ${context.repo.repo}. ` +
                `The PAT must also have Actions → write on ${AGENT_OWNER}/${AGENT_REPO} ` +
                `(fine-grained PAT: grant Actions → write; classic PAT: add "workflow" scope).`;
              core.setFailed(reason);
              core.setOutput('failure_reason', reason);
              core.setOutput('issue_number', String(issueNumber));
              return;
            }

            // Guard: skip if a workflow run for this same issue is already queued/in_progress.
            // This prevents the issue label trigger and the weekly org-scan from duplicating the
            // same implementation run for the same target issue.
            const workflowId = 'al-new-feature.lock.yml';
            const statuses = ['queued', 'in_progress', 'requested', 'waiting', 'pending'];
            let hasInFlightRun = false;
            try {
              for (const status of statuses) {
                const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                  owner: AGENT_OWNER,
                  repo: AGENT_REPO,
                  workflow_id: workflowId,
                  status,
                  per_page: 100,
                });
                if (!Array.isArray(runs) || runs.length >= 1000 ||
                    runs.some(run => !run || typeof run.event !== 'string' ||
                      (run.inputs != null && (typeof run.inputs !== 'object' || Array.isArray(run.inputs))))) {
                  throw new Error('invalid or incomplete workflow run response');
                }
                if (runs.some(run => {
                  const hasIssueInput = run.inputs && String(run.inputs.issue_number || '') === String(issueNumber);
                  const hasTargetRepo = !run.inputs || !run.inputs.target_repo || String(run.inputs.target_repo).toLowerCase() === thisRepo.toLowerCase();
                  return hasIssueInput && hasTargetRepo && (
                    run.event === 'workflow_dispatch' ||
                    (run.display_title || '').includes(`#${issueNumber}`) ||
                    (run.name || '').includes(`#${issueNumber}`)
                  );
                })) {
                  hasInFlightRun = true;
                  break;
                }
              }
            } catch (err) {
              core.warning(
                `Could not inspect in-flight runs for ${workflowId}: ${err.message}. Skipping dispatch.`
              );
              return;
            }
            if (hasInFlightRun) {
              core.info(
                `Issue #${issueNumber} already has an in-flight al-new-feature run — skipping duplicate dispatch.`
              );
              return;
            }

            const inputs = {
              issue_number: String(issueNumber),
              ...(isLocal ? {} : { target_repo: thisRepo }),
            };

            // Retry up to 3 times with exponential back-off to handle transient
            // 5xx responses from GitHub (known to occur with Node.js 24 native fetch
            // + octokit-core 5.x, where 500/503 responses surface as "fetch failed").
            let lastErr;
            for (let attempt = 1; attempt <= 3; attempt++) {
              featurePr = await featurePrReason();
              if (featurePr) {
                core.info(`Issue #${issueNumber}: ${featurePr} — skipping dispatch.`);
                return;
              }
              owned = await ownershipReason();
              if (owned) {
                core.info(`Issue #${issueNumber} is ${owned} — skipping dispatch.`);
                return;
              }
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner: AGENT_OWNER,
                  repo: AGENT_REPO,
                  ref: 'main',
                  workflow_id: 'al-new-feature.lock.yml',
                  inputs,
                });
                core.info(`Dispatched al-new-feature for ${thisRepo}#${issueNumber} (attempt ${attempt})`);
                lastErr = null;
                break;
              } catch (err) {
                lastErr = err;
                const status = err.status ?? 0;
                // Retry only on transient server-side or network errors (5xx / no status).
                // Auth errors (4xx) are permanent — fail immediately.
                if (status >= 400 && status < 500) break;
                if (attempt < 3) {
                  const delay = attempt * 5000;
                  core.warning(`Attempt ${attempt} failed (HTTP ${status || 'network'}): ${err.message} — retrying in ${delay / 1000}s…`);
                  await new Promise(r => setTimeout(r, delay));
                }
              }
            }

            if (lastErr) {
              featurePr = await featurePrReason();
              if (featurePr) {
                core.info(`Issue #${issueNumber}: ${featurePr} — skipping failure comment.`);
                return;
              }
              owned = await ownershipReason();
              if (owned) {
                core.info(`Issue #${issueNumber} is ${owned} — skipping failure comment.`);
                return;
              }
              const status  = lastErr.status ?? 0;
              const isAuthError = status >= 400 && status < 500;
              let reason;
              if (isAuthError) {
                const requiredScopes = lastErr.response?.headers?.['x-accepted-github-permissions'] ?? 'actions=write';
                reason =
                  `createWorkflowDispatch on ${AGENT_OWNER}/${AGENT_REPO} failed ` +
                  `(HTTP ${status}): ${lastErr.message}. ` +
                  `Required scopes: ${requiredScopes}. ` +
                  `GH_AW_GITHUB_MCP_SERVER_TOKEN must have actions:write on ${AGENT_OWNER}/${AGENT_REPO} ` +
                  `(fine-grained PAT: grant Actions → write; classic PAT: add "workflow" scope). ` +
                  `The org-scan weekly batch will still dispatch this issue in the next run, ` +
                  `or an admin can manually dispatch from skc-bc-internal-agents → Actions → New AL Feature Agent.`;
              } else {
                reason =
                  `createWorkflowDispatch on ${AGENT_OWNER}/${AGENT_REPO} failed after 3 attempts ` +
                  `(HTTP ${status || 'network error'}): ${lastErr.message}. ` +
                  `This is likely a transient GitHub API issue — re-labelling the issue will retry the dispatch, ` +
                  `or wait for the weekly org-scan (Monday 07:00 UTC).`;
              }
              core.setFailed(reason);
              core.setOutput('failure_reason', reason);
              core.setOutput('issue_number', String(issueNumber));
            }

      - name: Post dispatcher-failure comment on issue
        if: failure() && steps.dispatch.outputs.failure_reason != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8 (Node 24)
        with:
          github-token: ${{ github.token }}
          script: |
            const issue_number = Number('${{ steps.dispatch.outputs.issue_number || github.event.issue.number }}');
            const reason = `${{ steps.dispatch.outputs.failure_reason }}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '⚠️ **Could not queue this issue for automatic implementation.**',
              '',
              `**Reason:** ${reason}`,
              '',
              `**Run:** [View dispatcher logs](${runUrl})`,
              '',
              'The `ready-to-implement` label was NOT removed — re-label after fixing the token, ' +
              'or wait for the weekly org-scan (Monday 07:00 UTC) which dispatches from skc-bc-internal-agents directly.',
              '',
              '_Generated by [skc-bc-internal-agents](https://github.com/SK-Consulting-S-A/skc-bc-internal-agents)._',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body,
            }).catch(e => core.warning(`Could not post failure comment: ${e.message}`));
